name: LinkedIn Prospector 24-7 Cloud Engine

on:
  workflow_dispatch:
    inputs:
      target_profile:
        description: 'Sélectionnez le Profil Cible à Prospecter :'
        required: true
        type: choice
        default: '🇲🇦 Maroc - Ingénierie, Tech, IA & ESN (Casablanca / Rabat / Fès)'
        options:
          - '🇲🇦 Maroc - Ingénierie, Tech, IA & ESN (Casablanca / Rabat / Fès)'
          - '🇲🇦 Maroc - Aéronautique, Drones & Industrie (Casablanca / Nouaceur / Tanger)'
          - '🇲🇦 Maroc - Grands Groupes Nationaux & R&D (OCP, UM6P, Télécoms, Banques)'
          - '🇫🇷 France - Drones & Systèmes Embarqués'
  schedule:
    - cron: '0 9 * * *'  # Tourne 7j/7 tous les jours de l'année

jobs:
  prospect:
    runs-on: ubuntu-latest
    timeout-minutes: 120

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          ref: main

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Install Playwright Chromium with full Linux system dependencies
        run: |
          python -m playwright install --with-deps chromium

      - name: Run Cloud Prospecting Pipeline
        env:
          GOOGLE_API_KEY: ${{ secrets.GOOGLE_API_KEY }}
          LINKEDIN_COOKIE: ${{ secrets.LINKEDIN_COOKIE }}
          TARGET_PROFILE: ${{ inputs.target_profile || '🇲🇦 Maroc - Ingénierie, Tech, IA & ESN (Casablanca / Rabat / Fès)' }}
          EXECUTION_MODE: "cloud"
          HEADLESS: "true"
          MAX_PROFILES_PER_SEARCH: 20
        run: |
          python cloud_runner.py

      - name: Save new leads and Excel file to repository
        run: |
          git config --global user.name "Prospector Cloud Bot"
          git config --global user.email "bot@prospector.local"
          git add data/ 2>/dev/null || true
          if git diff --staged --quiet; then
            echo "No changes to commit."
          else
            git commit -m "chore(auto): mise a jour automatique des leads [skip ci]"
            git push origin main
          fi